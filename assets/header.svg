<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <path id="ch1" d="M 656 100 L 752 44" fill="none"/>
    <path id="ch2" d="M 656 100 L 762 100" fill="none"/>
    <path id="ch3" d="M 656 100 L 752 156" fill="none"/>
    <path id="rt1" d="M 752 44 L 830 100" fill="none"/>
    <path id="rt2" d="M 762 100 L 830 100" fill="none"/>
    <path id="rt3" d="M 752 156 L 830 100" fill="none"/>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="199" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- guide lines -->
  <line x1="24" y1="30" x2="856" y2="30" stroke="#21262d" stroke-width="1"/>
  <line x1="24" y1="168" x2="856" y2="168" stroke="#21262d" stroke-width="1"/>
  <line x1="580" y1="30" x2="580" y2="168" stroke="#21262d" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- meta labels -->
  <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590">&#x2387; main</text>
  <text x="580" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" text-anchor="start">justCatTheFish &#183; ctftime</text>

  <!-- name block -->
  <text x="24" y="86" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#e6edf3">tomek7667</text>
  <text x="25" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#00ADD8">SECURITY ENGINEER &#183; CTF PLAYER</text>
  <text x="25" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d8590">Go &#183; TypeScript &#183; Python &#183; SQLite &#183; Gda&#324;sk, PL</text>

  <!-- request paths (fan-out) -->
  <use href="#ch1" stroke="#21262d" stroke-width="1"/>
  <use href="#ch2" stroke="#21262d" stroke-width="1"/>
  <use href="#ch3" stroke="#21262d" stroke-width="1"/>
  <!-- flag paths (fan-in) -->
  <use href="#rt1" stroke="#21262d" stroke-width="1"/>
  <use href="#rt2" stroke="#21262d" stroke-width="1"/>
  <use href="#rt3" stroke="#21262d" stroke-width="1"/>

  <!-- payload node -->
  <rect x="612" y="88" width="44" height="24" rx="3" fill="#161b22" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="634" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#00ADD8" text-anchor="middle">payload</text>

  <!-- target nodes -->
  <circle cx="752" cy="44" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>
  <circle cx="762" cy="100" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>
  <circle cx="752" cy="156" r="5" fill="#161b22" stroke="#58a6a6" stroke-width="1.2"/>

  <!-- flag node -->
  <rect x="814" y="90" width="32" height="20" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="830" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#3fb950" text-anchor="middle">flag</text>

  <!-- packets fan-out -->
  <circle r="2.4" fill="#00ADD8">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#ch1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.4" fill="#00ADD8">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#ch2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="2.4" fill="#00ADD8">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#ch3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
  </circle>

  <!-- packets fan-in -->
  <circle r="2" fill="#3fb950">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#rt1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle r="2" fill="#3fb950">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath href="#rt2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle r="2" fill="#3fb950">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath href="#rt3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- target pulse -->
  <circle cx="762" cy="100" r="8" fill="none" stroke="#58a6a6" stroke-width="1">
    <animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- marker + blinking cursor -->
  <text x="856" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" text-anchor="end">0x1337</text>
  <rect x="805" y="149" width="7" height="11" fill="#00ADD8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
